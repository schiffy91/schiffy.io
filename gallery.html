<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alexander Schiffhauer</title>
  <meta name="description" content="Photography by Alexander Schiffhauer">
  <meta name="author" content="Alexander Schiffhauer">
  <meta property="og:image" content="img/signature/signature-wide.png">
  <link rel="icon" href="img/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="img/favicon/apple-touch-icon.png">
  <link rel="manifest" href="img/favicon/site.webmanifest">
  <link rel="mask-icon" href="img/favicon/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-config" content="img/favicon/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/grid.js"></script>
  <script defer src="js/lightbox.js"></script>
</head>
<body>
  <header>
    <h1>schiffy</h1>
    <img src="img/signature/signature-wide.png" alt="Alexander Schiffhauer">
  </header>
  <main class="gallery" aria-label="Photography">
<!-- photos -->
  </main>
  <dialog aria-label="Photo viewer">
    <div class="stage">
      <img class="neighbor previous" alt="" draggable="false">
      <img class="neighbor next" alt="" draggable="false">
      <div class="frame"></div>
      <div class="minimap" hidden title="Drag to pan">
        <img alt="" draggable="false">
        <span></span>
      </div>
    </div>
    <div class="controls">
      <button id="previous" aria-label="Previous photograph" title="Previous (←)">←</button>
      <span id="counter" aria-live="polite"></span>
      <button id="next" aria-label="Next photograph" title="Next (→)">→</button>
      <span class="spacer"></span>
      <button id="smaller" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button id="fit" aria-label="Fit photograph to screen" title="Fit to screen (0)">100%</button>
      <button id="larger" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button id="close" aria-label="Close viewer" title="Close (Esc)" autofocus>×</button>
    </div>
    <p id="notice" role="status"></p>
  </dialog>
</body>
</html>
